<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1812" />
      <stop offset="100%" stop-color="#060a08" />
    </linearGradient>
    <linearGradient id="greenGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3ddc84" />
      <stop offset="100%" stop-color="#00b050" />
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00ff88" />
      <stop offset="100%" stop-color="#00c853" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#00e676" flood-opacity="0.5" />
    </filter>
  </defs>
  
  <!-- Rounded container -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)" stroke="#2b4a32" stroke-width="2" />
  
  <!-- Circuit background traces -->
  <path d="M5 22h7l5 5M59 42h-7l-5-5" fill="none" stroke="#173120" stroke-width="1.5" stroke-linecap="round" />
  <circle cx="17" cy="27" r="1.5" fill="#204429" />
  <circle cx="47" cy="37" r="1.5" fill="#204429" />

  <!-- Smartphone Board with Chip (Left) -->
  <rect x="10" y="26" width="18" height="26" rx="3.5" fill="#0e1b13" stroke="url(#greenGlow)" stroke-width="1.8" filter="url(#glow)" />
  <!-- Chip inside phone -->
  <rect x="15" y="34" width="8" height="8" rx="1.5" fill="#142c1c" stroke="#00ff88" stroke-width="1.2" />
  <!-- Circuit pins/nodes -->
  <path d="M19 31v3M19 42v3M12 38h3M23 38h3" fill="none" stroke="#00e676" stroke-width="1.2" stroke-linecap="round" />

  <!-- Microscope Body (Center/Right) -->
  <g filter="url(#glow)">
    <!-- Eyepiece / Ocular tube angled -->
    <rect x="23" y="11" width="6.5" height="15" rx="2" transform="rotate(-36 26 18)" fill="url(#greenGlow)" stroke="#00ff88" stroke-width="0.8" />
    <rect x="23.5" y="8" width="5.5" height="4" rx="1" transform="rotate(-36 26 10)" fill="#69f0ae" />
    
    <!-- Focus knob / Joint -->
    <circle cx="28" cy="22" r="4.5" fill="#0e1b13" stroke="url(#greenGlow)" stroke-width="2" />
    <circle cx="28" cy="22" r="2" fill="#00e676" />
    
    <!-- Curved Arm -->
    <path d="M28 26c6 2 11 8 10 16-1 5-4 8-8 9" fill="none" stroke="url(#greenGlow)" stroke-width="3" stroke-linecap="round" />
    
    <!-- Stage / Base stand -->
    <path d="M25 47h11v4H23a2 2 0 0 1 2-4z" fill="url(#greenGlow)" />
  </g>

  <!-- Lettering 'Br3' in brand typography -->
  <g font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="12.5">
    <text x="39" y="32" fill="#ffffff" letter-spacing="-0.3">Br</text>
    <text x="51.5" y="32" fill="#00e676">3</text>
  </g>
</svg>
